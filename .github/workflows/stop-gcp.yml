name: Stop Google Cloud

# Deletes every Paranoid VM on Google Cloud right away, running or not, and
# settles its cost in the ledger. Chats that have started keep working,
# because they're peer to peer.
#
# No secret: it signs in with Workload Identity Federation as the delete-only
# paranoid-cleanup service account, in the `gcp-cleanup` environment, which
# only `main` may use. It doesn't wait for approval, so it's quick in an
# emergency, and it can only delete. Only a manual run starts this.

on:
  workflow_dispatch:

permissions:
  contents: read

# Its own group, so it never waits behind a deploy that's waiting for
# approval or a cleanup. A second Stop waits for the first.
concurrency:
  group: paranoid-gcp-stop
  cancel-in-progress: false

jobs:
  # A deploy that's queued, waiting for approval or running is cancelled
  # first. A running one then deletes the VM it created, even one it creates
  # after the next job has listed the VMs. Through the API, because the
  # deploy isn't in this workflow's concurrency group.
  cancel:
    name: Cancel deploys in progress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Cancel deploys in progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$REPO" --workflow deploy-gcp.yml --status "$status" \
              --json databaseId --jq '.[].databaseId'
          done | sort -u | while read -r run; do
            echo "Cancelling deploy run $run"
            gh run cancel "$run" --repo "$REPO" || true
          done

  stop:
    name: Delete the VMs
    needs: cancel
    # Delete them even if cancelling failed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: gcp-cleanup

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the settings
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_BUCKET: ${{ vars.GCP_BUCKET }}
        run: bash deploy/gcp/settings.sh manage

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Delete every VM
        run: bash deploy/gcp/vms.sh all
