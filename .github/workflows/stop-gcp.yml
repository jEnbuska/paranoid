name: Stop Google Cloud

# Deletes every Paranoid VM on Google Cloud right away, running or not, and
# settles its cost in the ledger. Chats that have started keep working,
# because they're peer to peer.
#
# No secret: it signs in with Workload Identity Federation, in the `gcp`
# environment, which only `main` may use. Only a manual run starts this.

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with deploy-gcp.yml and cleanup-gcp.yml. Stopping cancels a deploy
# in progress, which then deletes the VM it created, and this run deletes
# whatever is left.
concurrency:
  group: gcp
  cancel-in-progress: true

jobs:
  stop:
    name: Delete the VMs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: gcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the settings
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_BUCKET: ${{ vars.GCP_BUCKET }}
        run: bash deploy/gcp/settings.sh manage

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Delete every VM
        run: bash deploy/gcp/vms.sh all
