name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it makes outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Draft PRs often start with an empty commit, so there's nothing to check.
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json. It has
      # to run before setup-node, whose pnpm cache needs pnpm on the PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Find dead code
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Draft PRs often start with an empty commit, so there's nothing to check.
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    # PRs into main are releases from dev, the only time every browser runs.
    # Everything else runs Chromium, and sessions run the rest locally.
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.base_ref == 'main' && fromJSON('["chromium","firefox","webkit"]') || fromJSON('["chromium"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # GitHub's Ubuntu image already has the libraries Chromium needs, so
      # Chromium skips apt, which hangs when Ubuntu's mirror is unreachable.
      # Firefox and WebKit need more packages.
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install ${{ matrix.browser != 'chromium' && '--with-deps' || '' }} ${{ matrix.browser }}

      # The cache holds the browser, not the system packages it needs
      - name: Install system dependencies of the cached browser
        if: steps.browser-cache.outputs.cache-hit == 'true' && matrix.browser != 'chromium'
        run: pnpm --filter e2e exec playwright install-deps ${{ matrix.browser }}

      - name: Run end-to-end tests
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/e2e/playwright-report
          retention-days: 7
