name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  # The Release workflow (release.yml) starts CI on main this way, because its
  # push, made with GITHUB_TOKEN, doesn't start workflows. It runs like a push.
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it makes outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides from a PR's changed files which of the jobs below have work to do.
  # Only PRs skip anything: pushes and manual runs run everything.
  changes:
    name: Find the changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.changes.outputs.checks }}
      format: ${{ steps.changes.outputs.format }}
      e2e: ${{ steps.changes.outputs.e2e }}
      deps: ${{ steps.changes.outputs.deps }}
      deploy_docs: ${{ steps.changes.outputs.deploy_docs }}

    steps:
      # A PR checks out its merge commit, whose first parent is the tip of the
      # base branch, so two commits are enough to diff against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2

      # - checks: everything except docs (Markdown and LICENSE). oxfmt formats
      #   Markdown, so a Markdown change still runs the format check, alone.
      # - e2e: the packages (except their docs) and what installs them.
      # - deps: any package.json or the lockfile.
      # - deploy_docs: the deployment docs (docs/deploy/ and the READMEs in
      #   deploy/), which "Check the deployment docs" compares with the deploy
      #   workflows. Changes to the workflows and scripts run the checks anyway.
      # - A change to this workflow runs everything.
      - name: Decide which jobs run
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'checks=true\nformat=true\ne2e=true\ndeps=true\ndeploy_docs=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          checks=false format=false e2e=false deps=false deploy_docs=false
          while IFS= read -r file; do
            echo "Changed: $file"
            case "$file" in
              .github/workflows/ci.yml) checks=true format=true e2e=true deps=true deploy_docs=true ;;
              *.md) format=true ;;
              LICENSE) ;;
              *) checks=true format=true ;;
            esac
            case "$file" in
              *.md) ;;
              packages/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .nvmrc) e2e=true ;;
            esac
            case "$file" in
              package.json | */package.json | pnpm-lock.yaml) deps=true ;;
            esac
            case "$file" in
              docs/deploy/* | deploy/*) deploy_docs=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          printf 'checks=%s\nformat=%s\ne2e=%s\ndeps=%s\ndeploy_docs=%s\n' "$checks" "$format" "$e2e" "$deps" "$deploy_docs" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Lint, format, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Draft PRs often start with an empty commit, so there's nothing to check.
    # Every other PR runs this job, if only for the secret scan: it's a
    # required check, so a failing scan blocks the merge. `!cancelled()` runs
    # it even if `changes` fails: its outputs are then empty, which isn't
    # 'false', so every step runs.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0)

    steps:
      # The whole history, so the secret scan can read every new commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pinned release, checked against its checksum from the release's
      # gitleaks_<version>_checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Every commit the PR or push adds, docs included, with gitleaks'
      # default rules and the providers' token rules in .gitleaks.toml. A PR
      # checks out its merge commit: HEAD^1 is the base and HEAD^2 the PR's
      # head. A push scans from the commit before it, or everything for a new
      # branch or a manual run (the Release workflow's CI on main). `--redact` keeps a found secret out of the public log.
      - name: Scan the new commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            range='HEAD^1..HEAD^2'
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range=HEAD
          else
            range="$BEFORE..HEAD"
          fi
          echo "Scanning $range"
          gitleaks git --config .gitleaks.toml --log-opts="$range" --redact --verbose --no-banner .

      # Reads the pnpm version from `packageManager` in package.json. It has
      # to run before setup-node, whose pnpm cache needs pnpm on the PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: >-
          needs.changes.outputs.checks != 'false'
          || needs.changes.outputs.format != 'false'
          || needs.changes.outputs.deploy_docs != 'false'
        run: pnpm install --frozen-lockfile

      # The runner image comes with shellcheck. globstar makes `**` match
      # every depth, so scripts in deeper folders are checked too.
      - name: Check the shell scripts
        if: needs.changes.outputs.checks != 'false'
        run: |
          shopt -s globstar
          shellcheck deploy/**/*.sh scripts/*.sh

      # A PR that only changes Markdown runs the format check and nothing else.
      - name: Lint
        if: needs.changes.outputs.checks != 'false'
        run: pnpm lint

      - name: Find dead code
        if: needs.changes.outputs.checks != 'false'
        run: pnpm knip

      - name: Format check
        if: needs.changes.outputs.format != 'false'
        run: pnpm format:check

      - name: Type check
        if: needs.changes.outputs.checks != 'false'
        run: pnpm typecheck

      - name: Test
        if: needs.changes.outputs.checks != 'false'
        run: pnpm test

      # Every environment, secret and variable the deploy workflows use is in
      # docs/deploy/, and nothing they don't. See "Adding a provider" in
      # docs/deploy/README.md.
      - name: Check the deployment docs
        if: >-
          needs.changes.outputs.checks != 'false'
          || needs.changes.outputs.deploy_docs != 'false'
        run: pnpm check:deploy-docs

      - name: Build
        if: needs.changes.outputs.checks != 'false'
        run: pnpm build

      # Checks the dependencies for known vulnerabilities of high severity or
      # worse with `pnpm audit`. GitHub's dependency review can't read pnpm
      # 12's lockfile, which is two YAML documents. It runs last, and even
      # after an earlier step fails, so neither hides the other's result.
      # - A PR into main, or a push to main, audits the whole tree, whatever
      #   files changed: this job is required in the main ruleset, so a
      #   finding blocks the release. Fix it in dev first, in its own PR.
      # - A PR into dev that changes a package.json or the lockfile fails
      #   only on what it adds, compared with its base (HEAD^1), so an
      #   advisory for a dependency it didn't touch doesn't fail it: the
      #   weekly audit (audit.yml) opens an issue for those.
      # - Other pushes skip it: they can't be blocked, and the weekly audit
      #   covers them.
      - name: Check the dependencies for known vulnerabilities
        if: >-
          !cancelled()
          && (github.base_ref == 'main'
            || github.ref == 'refs/heads/main'
            || (github.event_name == 'pull_request' && needs.changes.outputs.deps != 'false'))
        env:
          WHOLE_TREE: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          pnpm audit --audit-level=high --json > "$RUNNER_TEMP/audit.json" || true
          base=()
          if [ "$WHOLE_TREE" != true ]; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            pnpm --dir "$RUNNER_TEMP/base" audit --audit-level=high --json > "$RUNNER_TEMP/base-audit.json" || true
            base=("$RUNNER_TEMP/base-audit.json")
          fi
          status=0
          node scripts/audit-report.mts "$RUNNER_TEMP/audit.json" "${base[@]}" > "$RUNNER_TEMP/report.md" || status=$?
          if [ "$status" = 1 ]; then
            if [ "$WHOLE_TREE" = true ]; then
              heading='Known vulnerabilities in the dependencies'
              message='The dependencies have known vulnerabilities of high severity or worse, listed above and in the job summary. Fix them in dev first, in a PR of their own, then update this branch.'
            else
              heading='Known vulnerabilities this PR adds'
              message='This PR adds dependencies with known vulnerabilities of high severity or worse. Update each one to its fixed version, listed above and in the job summary.'
            fi
            cat "$RUNNER_TEMP/report.md"
            { echo "## $heading"; echo; cat "$RUNNER_TEMP/report.md"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$message"
          fi
          exit "$status"

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Draft PRs often start with an empty commit, so there's nothing to check.
    # Skipping this job for any other reason would report a single check named
    # `End-to-end tests (${{ matrix.browser }})`, and the required
    # `End-to-end tests (chromium)` would wait forever. So the matrix always
    # runs, and its steps skip when no file the tests check has changed.
    # `!cancelled()` runs it even if `changes` fails, with every step.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0)
    # Every PR and push runs every browser, so a browser-specific failure
    # shows up on the PR itself.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Playwright's image already has every browser and the system packages
    # they need, so nothing runs apt, which hangs when Ubuntu's mirror is
    # unreachable. Its version must match `@playwright/test` in
    # pnpm-lock.yaml; the "Check the image's browsers" step fails if it
    # doesn't. It runs as root, which Playwright's own CI setup does too.
    # `--ipc=host` keeps Chromium from running out of shared memory.
    container:
      image: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f # v1.64.1-noble
      options: --ipc=host

    steps:
      - name: Skip, as no file the end-to-end tests check has changed
        if: needs.changes.outputs.e2e == 'false'
        run: echo "Nothing to test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.e2e != 'false'
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: needs.changes.outputs.e2e != 'false'
        timeout-minutes: 3
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # The image comes with its own Node.js, which isn't the one in .nvmrc
      - name: Set up Node.js
        if: needs.changes.outputs.e2e != 'false'
        timeout-minutes: 3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.e2e != 'false'
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      # Each Playwright version needs its own browser builds. A dry run lists
      # where the installed Playwright looks for them, without downloading.
      - name: Check the image's browsers
        if: needs.changes.outputs.e2e != 'false'
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          version=$(pnpm --filter e2e exec playwright --version | cut -d ' ' -f 2)
          dirs=$(pnpm --filter e2e exec playwright install --dry-run "$BROWSER" | sed -n 's/^ *Install location: *//p')
          if [ -z "$dirs" ]; then
            echo "::error::playwright install --dry-run listed no browsers."
            exit 1
          fi
          missing=0
          for dir in $dirs; do
            if [ ! -d "$dir" ]; then
              echo "::error::The Playwright image has no $dir, which Playwright $version needs. Update the image in ci.yml to the version of @playwright/test in pnpm-lock.yaml."
              missing=1
            fi
          done
          exit "$missing"

      # Firefox refuses to run as root when HOME belongs to another user, and
      # GitHub sets HOME to /github/home, which the runner's user owns.
      - name: Run end-to-end tests
        if: needs.changes.outputs.e2e != 'false'
        env:
          HOME: /root
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/e2e/playwright-report
          retention-days: 7
