name: Stop Azure

# Deletes every Paranoid VM on Azure right away, running or not, with its
# disk, NIC and public IP. Chats that have started keep working, because
# they're peer to peer.
#
# It signs in through GitHub OIDC, with no secret, as paranoid-cleaner,
# which can only find and delete, using the `azure-cleanup` environment,
# which only `main` may use. It doesn't wait for an approval, unlike a
# deploy, so stopping is never held up. Only a manual run starts this.

on:
  workflow_dispatch:

permissions:
  contents: read

# Its own group, so it never waits behind a deploy, even one waiting for
# approval. It cancels every unfinished deploy first, which then deletes the
# server it created, waits for them to finish, and then deletes whatever is
# left.
concurrency:
  group: paranoid-azure-stop
  cancel-in-progress: false

jobs:
  stop:
    name: Delete the servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-cleanup
    permissions:
      # Only for cancelling the deploy runs
      actions: write
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'paranoid' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cancel the deploys
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash deploy/azure/cancel-deploys.sh

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLEANUP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete every server
        run: bash deploy/azure/delete-servers.sh all
