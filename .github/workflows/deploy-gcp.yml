name: Deploy to Google Cloud

# Starts a Paranoid VM on Google Cloud for a set number of invites. It powers
# itself off once the last one is finished, cleanup-gcp.yml then deletes it,
# and Google Cloud deletes it at the end of its lifetime whatever happens.
# A deployment whose worst-case cost doesn't fit the month's limit isn't
# started. See docs/deploy/gcp.md.
#
# There's no secret. The job signs in with Workload Identity Federation: its
# short-lived GitHub OIDC token is exchanged for a short-lived token of the
# deploy service account, and Google Cloud accepts only tokens for this
# repository's main branch in the `gcp` environment. Only a manual run starts
# this workflow, never a pull request, and the `gcp` environment makes it wait
# for the owner's approval before the job starts (docs/deploy/gcp.md).

on:
  workflow_dispatch:
    inputs:
      max_invites:
        description: "Invites before the server shuts down. Empty: the MAX_INVITES variable, or 5."
        required: false
        type: string
      lifetime_minutes:
        description: "Minutes until Google Cloud deletes it at the latest, at most 1440 (24 hours). Empty: the LIFETIME_MINUTES variable, or 60."
        required: false
        type: string

permissions:
  contents: read

# Shared with stop-gcp.yml, so only one deploy runs at a time: the next
# waits for this one. Stop cancels this run, and then the last step deletes
# its VM. A run waiting for approval is cancelled too if GitHub counts it as
# in the group; if not, Stop doesn't wait for it, and it only runs if it's
# approved. cleanup-gcp.yml has a
# group of its own and only deletes VMs that are off or past their expiry,
# never this one. Each ledger write checks the ledger's generation, so two
# runs settling at once can't overwrite each other.
concurrency:
  group: gcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # For the OIDC token that Workload Identity Federation exchanges
      id-token: write
    environment:
      name: gcp
      url: ${{ steps.create.outputs.url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is deleted, so a bad setting leaves a running VM
      # alone
      - name: Check the settings
        env:
          MAX_INVITES: ${{ inputs.max_invites || vars.MAX_INVITES || '5' }}
          LIFETIME_MINUTES: ${{ inputs.lifetime_minutes || vars.LIFETIME_MINUTES || '60' }}
          MAX_EGRESS_MBIT: ${{ vars.MAX_EGRESS_MBIT || '2' }}
          MAX_DEPLOY_COST_USD: ${{ vars.MAX_DEPLOY_COST_USD || '1' }}
          GCP_MONTHLY_BUDGET_USD: ${{ vars.GCP_MONTHLY_BUDGET_USD || '5' }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_BUCKET: ${{ vars.GCP_BUCKET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash deploy/gcp/settings.sh deploy

      # deploy/gcp/cli.ts runs with Node's type stripping and imports
      # packages/deploy, so pnpm links that workspace package. --prod skips
      # every dev dependency, so nothing else is downloaded.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the ledger's dependencies
        run: pnpm install --frozen-lockfile --prod --filter deploy-gcp

      # Every provider's limit on one deploy, MAX_DEPLOY_COST_USD, with the
      # same worst case as the ledger below. Before signing in, so a deploy
      # that's too expensive never reaches Google Cloud.
      - name: Check the worst-case cost
        run: >-
          node packages/deploy/src/cli.ts --prices deploy/gcp/prices.json
          --region "$GCP_REGION" --server e2-micro
          --lifetime-minutes "$LIFETIME_MINUTES" --egress-mbit "$MAX_EGRESS_MBIT"
          --limit-usd "$MAX_DEPLOY_COST_USD"

      # Writes a credentials file that gcloud reads. It holds no key: it
      # tells gcloud to exchange this job's OIDC token, and it only works
      # while the job runs. Nothing uploads or commits the workspace.
      - name: Sign in to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Pinned and checked, not the runner image's gcloud
      - name: Set up gcloud
        uses: ./.github/actions/setup-gcloud

      # Google Cloud's own second limit, GCP_MONTHLY_BUDGET_USD, on the
      # month's total. Before the VM exists. A running VM's reservation still
      # counts in full here, so this can only refuse too early, never too late.
      - name: Check the month's spending limit
        id: budget
        env:
          REGION: ${{ env.GCP_REGION }}
        run: bash deploy/gcp/ledger.sh reserve

      # Running or stopped, so there's only ever one server
      - name: Delete the existing servers
        run: bash deploy/gcp/delete-servers.sh all

      # The VM fetches this exact commit of this repository, which is public,
      # so it needs no credentials.
      - name: Create the server
        id: create
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: bash deploy/gcp/create-server.sh

      # The VM installs and builds the app first, which takes a while on an
      # e2-micro.
      - name: Wait for the app
        env:
          HOST: ${{ steps.create.outputs.host }}
        run: bash deploy/ci/wait-for-app.sh "$HOST" 1200

      - name: Write the summary
        env:
          URL: ${{ steps.create.outputs.url }}
          EXPIRES: ${{ steps.create.outputs.expires }}
          REMAINING: ${{ steps.budget.outputs.remaining_usd }}
        run: |
          shutdown=$(date -u -d "@$EXPIRES" '+%Y-%m-%d %H:%M UTC')
          {
            echo "## Paranoid is running"
            echo
            echo "**<$URL>**"
            echo
            echo "- It shuts down once $MAX_INVITES invites are finished, and Google Cloud deletes it at $shutdown at the latest. Chats that have started keep working after that."
            echo "- It's an e2-micro VM in $GCP_ZONE. The Clean up Google Cloud workflow deletes it within about an hour of shutting down, and the Stop Google Cloud workflow deletes it right away."
            echo "- The most it can cost is \$$WORST_CASE_USD."
            echo "- \$$REMAINING of this month's \$$GCP_MONTHLY_BUDGET_USD Google Cloud limit is left for other deployments."
          } >> "$GITHUB_STEP_SUMMARY"

      # The setup's output, from the VM's serial console, to show why it
      # didn't come up. It holds only the setup's own messages.
      - name: Show the server's setup log
        if: failure() && steps.create.outcome == 'success'
        run: |
          gcloud compute instances get-serial-port-output "paranoid-$DEPLOYMENT" \
            --zone="$GCP_ZONE" 2>/dev/null | grep -E 'startup-script|google_metadata_script_runner' | tail -n 100 || true

      # Also when the run is cancelled, for example by stop-gcp.yml. Releases
      # the reservation if no VM was created.
      - name: Delete the server after a failed deploy
        if: (failure() || cancelled()) && steps.budget.outcome == 'success'
        run: bash deploy/gcp/delete-servers.sh run "$DEPLOYMENT"
