# Uses pull_request_target so a PR can't change this check inside the same PR:
# the workflow file comes from the default branch. That event is only safe
# because nothing here checks out or runs the PR's code; it reads event data and
# the issue's state. Don't add a checkout.
name: PR rules

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pr-rules:
    name: PR rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read

    steps:
      # PR data is untrusted input, so it reaches the script through env, never
      # through ${{ }} inside `run`.
      - name: Check the source branch and the linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # CI skips PRs with no changes. A skipped required check counts as
          # passing, so an empty PR must not be able to get through that way.
          # Drafts may stay empty, and GitHub won't merge a draft.
          if [ "$CHANGED_FILES" = 0 ] && [ "$IS_DRAFT" != true ]; then
            echo "::error::This PR has no changes, so CI didn't run."
            exit 1
          fi

          # A fork can have a branch with any name, so the name alone proves nothing.
          same_repo=false
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && same_repo=true

          if [ "$BASE" = main ]; then
            if [ "$same_repo" = true ] && [ "$HEAD" = dev ]; then
              echo "PR into main comes from dev"
              exit 0
            fi
            echo "::error::PRs into main can only come from this repository's dev branch."
            exit 1
          fi

          # PRs into dev.
          if [ "$same_repo" = true ]; then
            case "$HEAD" in
              hotfix/*)
                echo "Hotfix branch, no linked issue needed"
                exit 0
                ;;
            esac
          fi

          issues=$(printf '%s\n' "$PR_BODY" | grep -ioP '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\K\d+' | sort -u || true)
          for issue in $issues; do
            # The issues API also returns PRs, which have a pull_request field.
            state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq 'select(.pull_request == null) | .state' || true)
            if [ "$state" = open ]; then
              echo "Linked to open issue #$issue"
              exit 0
            fi
          done
          echo "::error::PRs into dev must link an open issue with Closes #N, Fixes #N or Resolves #N, or come from a hotfix/* branch in this repository."
          exit 1
